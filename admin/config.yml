backend:
  name: github
  repo: abababala/halalmodels
  branch: main

media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: settings
    label: "Site settings"
    files:
      - name: site
        label: "Everything on the site"
        file: content/site.json
        fields:
          - label: "1. Logo and name"
            name: brand
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Agency name", name: name, widget: string, required: false}
              - {label: "Logo (white on transparent, SVG or PNG)", name: logo, widget: image, required: false, hint: "Used in the top bar and, unless you set a menu logo below, in the menu"}
              - {label: "Menu logo (optional)", name: menu_logo, widget: image, required: false, hint: "Leave empty to use the main logo in the menu"}
              - {label: "Browser tab icon (square PNG, 512 by 512 is best)", name: favicon, widget: image, required: false, hint: "Leave empty to keep the built in H and M icon"}
              - {label: "Header logo height in pixels", name: logo_height, widget: number, required: false, value_type: int, min: 20, max: 120}
          - label: "2. Colours and fonts"
            name: look
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Colour style", name: preset, widget: select, required: false, options: ["black", "charcoal", "midnight"], default: black}
              - {label: "Background colour", name: bg, widget: color, required: false, hint: "Leave empty to use the colour style"}
              - {label: "Panel colour", name: surface, widget: color, required: false}
              - {label: "Text colour", name: text, widget: color, required: false}
              - {label: "Soft text colour", name: dim, widget: color, required: false}
              - {label: "Accent colour", name: accent, widget: color, required: false}
              - {label: "Thin line colour", name: line, widget: color, required: false}
              - {label: "Font pair", name: font_pair, widget: select, required: false, options: [{label: "Montserrat Bold with Archivo", value: montserrat}, {label: "Bodoni Moda with Archivo", value: bodoni}, {label: "Syne with Manrope", value: syne}, {label: "Big Shoulders with Archivo Narrow", value: shoulders}, {label: "Instrument Serif with Geist", value: instrument}], default: montserrat}
          - label: "3. Pages on or off"
            name: pages
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Journal", name: journal, widget: boolean, default: true}
              - {label: "Get Scouted", name: scouting, widget: boolean, default: true}
              - {label: "For Brands", name: brands, widget: boolean, default: true}
              - {label: "Casting", name: casting, widget: boolean, default: true}
              - {label: "Press", name: press, widget: boolean, default: true}
              - {label: "About", name: about, widget: boolean, default: true}
              - {label: "Team (inside About)", name: team, widget: boolean, default: true}
              - {label: "FAQ", name: faq, widget: boolean, default: true}
              - {label: "Contact", name: contact, widget: boolean, default: true}
          - label: "4. Menu names"
            name: nav
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Home", name: home, widget: string, required: false}
              - {label: "Models", name: models, widget: string, required: false}
              - {label: "Journal", name: journal, widget: string, required: false}
              - {label: "Get Scouted", name: scouting, widget: string, required: false}
              - {label: "For Brands", name: brands, widget: string, required: false}
              - {label: "Casting", name: casting, widget: string, required: false}
              - {label: "Press", name: press, widget: string, required: false}
              - {label: "About", name: about, widget: string, required: false}
              - {label: "FAQ", name: faq, widget: string, required: false}
              - {label: "Contact", name: contact, widget: string, required: false}
          - label: "5. Announcement bar"
            name: announcement
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Text", name: text, widget: string, required: false, hint: "Leave empty to hide the bar"}
              - {label: "Link (optional)", name: link, widget: string, required: false}
          - label: "6. Home page"
            name: home
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Small line above the headline", name: eyebrow, widget: string, required: false}
              - {label: "Headline", name: headline, widget: string, required: false, hint: "Put *stars* around a word to make it italic"}
              - {label: "Tagline", name: tagline, widget: text, required: false}
              - {label: "Women link name", name: women_label, widget: string, required: false}
              - {label: "Men link name", name: men_label, widget: string, required: false}
              - label: "Hero photos (slow slideshow)"
                name: hero_images
                widget: list
                required: false
                field: {label: Photo, name: p, widget: image}
              - label: "Scrolling words"
                name: ticker
                widget: list
                required: false
                field: {label: Word, name: w, widget: string}
              - {label: "Scrolling speed (seconds for one full pass, bigger is slower)", name: ticker_speed, widget: number, value_type: int, min: 10, max: 120, required: false, hint: "Empty means 40"}
              - {label: "Models section small label", name: board_label, widget: string, required: false}
              - {label: "Models section title", name: board_title, widget: string, required: false}
              - {label: "Models shown on the home page", name: featured_count, widget: number, required: false, value_type: int, min: 1, max: 24}
              - {label: "View all models button", name: all_label, widget: string, required: false}
              - {label: "Get Scouted block title", name: scout_title, widget: string, required: false}
              - {label: "Journal block title", name: journal_title, widget: string, required: false}
              - {label: "For Brands block title", name: brands_title, widget: string, required: false}
          - label: "7. Extra touches"
            name: features
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Show second photo when hovering a model", name: hover_second_photo, widget: boolean, default: true}
              - {label: "Client shortlist", name: shortlist, widget: boolean, default: true}
              - {label: "Scrolling words strip", name: ticker, widget: boolean, default: true}
              - {label: "Jobs on model pages", name: jobs, widget: boolean, default: true}
              - {label: "Polaroids on model pages", name: polaroids, widget: boolean, default: true}
              - {label: "Comp card on model pages", name: comp_card, widget: boolean, default: true}
              - {label: "About text on model pages", name: bio, widget: boolean, default: true}
              - {label: "Stats rows (category, height, city)", name: stats, widget: boolean, default: true}
              - {label: "Book this model button", name: book_button, widget: boolean, default: true}
          - label: "8. Get Scouted"
            name: scouting
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Title", name: title, widget: string, required: false}
              - {label: "Small label", name: label, widget: string, required: false}
              - {label: "Intro text", name: intro, widget: text, required: false}
              - {label: "Photo reminder", name: note, widget: string, required: false}
              - {label: "Small note under the button", name: subnote, widget: string, required: false}
              - {label: "Button name", name: button, widget: string, required: false}
          - label: "9. About"
            name: about
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Title", name: title, widget: string, required: false}
              - {label: "Small label", name: label, widget: string, required: false}
              - {label: "Intro text", name: intro, widget: text, required: false}
              - {label: "Wide photo", name: photo, widget: image, required: false, hint: "Optional. Shown in a fixed wide frame"}
              - {label: "Team heading", name: team_title, widget: string, required: false}
              - label: "Text blocks"
                name: blocks
                widget: list
                required: false
                summary: "{{fields.title}}"
                fields:
                  - {label: Title, name: title, widget: string}
                  - {label: Text, name: text, widget: text}
          - label: "10. Team"
            name: team
            widget: list
            collapsed: true
            required: false
            summary: "{{fields.name}}"
            fields:
              - {label: "Name", name: name, widget: string}
              - {label: "Role", name: title, widget: string, required: false}
              - {label: "Photo", name: photo, widget: image, required: false}
              - {label: "Crop focus", name: focus, widget: select, required: false, options: ["top", "upper", "center", "bottom"], default: upper}
              - {label: "Show", name: show, widget: boolean, default: true}
          - label: "11. For Brands"
            name: brands
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Title", name: title, widget: string, required: false}
              - {label: "Small label", name: label, widget: string, required: false}
              - {label: "Intro text", name: intro, widget: text, required: false}
              - {label: "Button name", name: button, widget: string, required: false}
              - {label: "Small note under the button", name: note, widget: string, required: false}
          - label: "12. Casting"
            name: casting
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Title", name: title, widget: string, required: false}
              - {label: "Small label", name: label, widget: string, required: false}
              - {label: "Intro text", name: intro, widget: text, required: false}
              - label: "Casting calls"
                name: items
                widget: list
                required: false
                summary: "{{fields.title}}"
                fields:
                  - {label: Title, name: title, widget: string}
                  - {label: Date, name: date, widget: string, required: false}
                  - {label: Location, name: location, widget: string, required: false}
                  - {label: Details, name: details, widget: text, required: false}
                  - {label: Show, name: show, widget: boolean, default: true}
          - label: "13. Press"
            name: press
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Title", name: title, widget: string, required: false}
              - {label: "Small label", name: label, widget: string, required: false}
              - {label: "Intro text", name: intro, widget: text, required: false}
              - label: "Press items"
                name: items
                widget: list
                required: false
                summary: "{{fields.headline}}"
                fields:
                  - {label: Outlet, name: outlet, widget: string, required: false}
                  - {label: Headline, name: headline, widget: string}
                  - {label: Link, name: link, widget: string, required: false}
                  - {label: Date, name: date, widget: string, required: false}
                  - {label: Show, name: show, widget: boolean, default: true}
          - label: "14. FAQ"
            name: faq
            widget: list
            collapsed: true
            required: false
            summary: "{{fields.q}}"
            fields:
              - {label: "Question", name: q, widget: string}
              - {label: "Answer", name: a, widget: text}
              - {label: "Show", name: show, widget: boolean, default: true}
          - label: "15. Contact and socials"
            name: contact
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Title", name: title, widget: string, required: false}
              - {label: "Small label", name: label, widget: string, required: false}
              - {label: "Intro text", name: text, widget: text, required: false}
              - {label: "Agency email", name: email, widget: string, required: false, hint: "Shown on the site. Also used for any email button below that has no address of its own"}
              - {label: "Scout email (Get Scouted form)", name: scout_email, widget: string, required: false, hint: "Applications go here. Empty means the agency email"}
              - {label: "Booking email (For Brands form and Book this model button)", name: booking_email, widget: string, required: false, hint: "Enquiries go here. Empty means the agency email"}
              - {label: "Location line", name: location, widget: string, required: false}
              - {label: "Agency Instagram handle", name: instagram, widget: string, required: false, hint: "A handle like halalmodels, or a full link"}
              - {label: "Agency TikTok handle", name: tiktok, widget: string, required: false, hint: "A handle like halalmodels, or a full link"}
              - {label: "Show email", name: show_email, widget: boolean, default: true}
              - {label: "Show Instagram", name: show_instagram, widget: boolean, default: true}
              - {label: "Show TikTok", name: show_tiktok, widget: boolean, default: true}
          - label: "Model categories"
            name: categories
            widget: list
            collapsed: true
            required: false
            summary: "{{fields.name}}"
            hint: "These appear as choices when you add or edit a model, and as filter buttons on the Models page, in this order"
            fields:
              - {label: "Category name", name: name, widget: string}
          - label: "Small texts and labels (every other word on the site)"
            name: labels
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Model page: Jobs tab name", name: jobs, widget: string, required: false}
              - {label: "Model page: Polaroids tab name", name: polaroids, widget: string, required: false}
              - {label: "Model page: Comp card tab name", name: comp, widget: string, required: false}
              - {label: "Model page: Book button name", name: book, widget: string, required: false}
              - {label: "Menu: button name", name: menu_button, widget: string, required: false}
              - {label: "Menu: open button hidden description", name: menu_open, widget: string, required: false}
              - {label: "Menu: close button hidden description", name: menu_close, widget: string, required: false}
              - {label: "Shortlist: link name in the header", name: shortlist_link, widget: string, required: false}
              - {label: "Shortlist: Add to shortlist button", name: add_shortlist, widget: string, required: false}
              - {label: "Shortlist: In shortlist button", name: in_shortlist, widget: string, required: false}
              - {label: "Shortlist: heading on the enquiry page", name: your_shortlist, widget: string, required: false}
              - {label: "Shortlist: message when empty", name: shortlist_empty, widget: string, required: false}
              - {label: "Shortlist: word in the email", name: shortlist_mail, widget: string, required: false}
              - {label: "Models page: All filter", name: all, widget: string, required: false}
              - {label: "Model page: back link", name: all_models, widget: string, required: false}
              - {label: "Models: message when there are no models", name: coming_soon, widget: string, required: false}
              - {label: "Model page: Category row name", name: stat_category, widget: string, required: false}
              - {label: "Model page: Height row name", name: stat_height, widget: string, required: false}
              - {label: "Model page: City row name", name: stat_city, widget: string, required: false}
              - {label: "Model page: word for one photo", name: photo, widget: string, required: false}
              - {label: "Model page: word for many photos", name: photos, widget: string, required: false}
              - {label: "Model page: name of the automatic job", name: portfolio, widget: string, required: false}
              - {label: "Model page: name for an unnamed job", name: job, widget: string, required: false}
              - {label: "Model page: Download PDF button", name: download_pdf, widget: string, required: false}
              - {label: "Photo viewer: Close", name: lightbox_close, widget: string, required: false}
              - {label: "Photo viewer: Prev", name: lightbox_prev, widget: string, required: false}
              - {label: "Photo viewer: Next", name: lightbox_next, widget: string, required: false}
              - {label: "Scout form: Full name", name: f_name, widget: string, required: false}
              - {label: "Forms: Email", name: f_email, widget: string, required: false}
              - {label: "Scout form: Gender", name: f_gender, widget: string, required: false}
              - {label: "Scout form: Height", name: f_height, widget: string, required: false}
              - {label: "Scout form: City", name: f_city, widget: string, required: false}
              - {label: "Scout form: Tell us about yourself", name: f_about, widget: string, required: false}
              - {label: "Scout form: Female option", name: g_female, widget: string, required: false}
              - {label: "Scout form: Male option", name: g_male, widget: string, required: false}
              - {label: "Scout form: Other option", name: g_other, widget: string, required: false}
              - {label: "Forms: Select placeholder", name: select, widget: string, required: false}
              - {label: "Brands form: Your name", name: b_name, widget: string, required: false}
              - {label: "Brands form: Company or brand", name: b_company, widget: string, required: false}
              - {label: "Brands form: Dates and location", name: b_dates, widget: string, required: false}
              - {label: "Brands form: About the project", name: b_brief, widget: string, required: false}
              - {label: "Email subject: scouting", name: subj_scout, widget: string, required: false}
              - {label: "Email subject: brand enquiry", name: subj_book, widget: string, required: false}
              - {label: "Email subject start: Book this model", name: book_subject, widget: string, required: false}
              - {label: "Email text: Book this model (keep {name} and {link})", name: book_body, widget: string, required: false}
              - {label: "Email: photo reminder lead in", name: reminder, widget: string, required: false}
              - {label: "Journal: small label on the home page", name: journal_home_label, widget: string, required: false}
              - {label: "Journal: small label on the Journal page", name: journal_page_label, widget: string, required: false}
              - {label: "Journal: message when empty", name: no_stories, widget: string, required: false}
              - {label: "FAQ: small label", name: faq_label, widget: string, required: false}
              - {label: "FAQ: page title", name: faq_title, widget: string, required: false}
              - {label: "Casting: message when empty", name: no_casting, widget: string, required: false}
              - {label: "Press: message when empty", name: no_press, widget: string, required: false}
              - {label: "Page not found: title", name: nf_title, widget: string, required: false}
              - {label: "Page not found: link name", name: nf_link, widget: string, required: false}
          - label: "16. Footer"
            name: footer
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Copyright line", name: copyright, widget: string, required: false}
              - {label: "Extra footer line (optional)", name: note, widget: string, required: false, hint: "For example a short tagline or a legal note. Empty hides it"}
              - {label: "Footer location line", name: location, widget: string, required: false, hint: "Empty uses the location from Contact and socials"}
              - {label: "Show email in footer", name: show_email, widget: boolean, default: true}
              - {label: "Show social icons in footer", name: show_socials, widget: boolean, default: true}
              - {label: "Show location line", name: show_location, widget: boolean, default: true}
              - {label: "Show copyright line", name: show_copyright, widget: boolean, default: true}
          - label: "17. Search and link sharing"
            name: seo
            widget: object
            collapsed: true
            required: false
            fields:
              - {label: "Website address", name: site_url, widget: string, required: false, hint: "For example https://halalmodels.com. Used for link previews and the sitemap"}
              - {label: "Website title", name: title, widget: string, required: false}
              - {label: "Description", name: description, widget: text, required: false}
              - {label: "Link preview picture", name: share_image, widget: image, required: false, hint: "1200 by 630 works best. Shown when the link is sent in chats"}
  - name: models
    label: "Models"
    label_singular: "Model"
    folder: models
    create: true
    delete: true
    identifier_field: name
    slug: "{{slug}}"
    summary: "{{name}} - {{gender}} - {{category}}"
    media_folder: /images/models
    public_folder: /images/models
    fields:
      - {label: "Name", name: name, widget: string}
      - {label: "Gender", name: gender, widget: select, options: [women, men]}
      - {label: "Category", name: category, widget: relation, collection: settings, file: site, search_fields: ["categories.*.name"], value_field: "categories.*.name", display_fields: ["categories.*.name"], required: false, hint: "Add or change the choices in Site settings, Model categories"}
      - {label: "Photo (main)", name: image, widget: image, hint: "Shown in a fixed portrait frame. It is cropped to fit, never stretched"}
      - label: "Gallery (additional photos)"
        name: images
        widget: list
        required: false
        field: {label: Photo, name: image, widget: image}
      - {label: "Crop focus", name: focus, widget: select, required: false, default: upper, hint: "Which part of the photo stays visible when cropped", options: [{label: "Upper (good for faces)", value: upper}, {label: Top, value: top}, {label: Centre, value: center}, {label: Bottom, value: bottom}]}
      - {label: "Height", name: height, widget: string, required: false}
      - {label: "City", name: city, widget: string, required: false}
      - {label: "About (optional)", name: bio, widget: text, required: false}
      - {label: "Instagram handle or link", name: instagram, widget: string, required: false, hint: "A handle like janedoe, or a full link"}
      - {label: "TikTok handle or link", name: tiktok, widget: string, required: false, hint: "A handle like janedoe, or a full link"}
      - {label: "Hide Instagram on this model", name: hide_instagram, widget: boolean, required: false, default: false}
      - {label: "Hide TikTok on this model", name: hide_tiktok, widget: boolean, required: false, default: false}
      - {label: "Featured on the home page", name: featured, widget: boolean, required: false, default: false}
      - {label: "Order (1 shows first)", name: order, widget: number, value_type: int, required: false}
      - label: "Jobs (each job opens its own photo carousel)"
        name: jobs
        widget: list
        required: false
        summary: "{{fields.title}}"
        fields:
          - {label: "Job title", name: title, widget: string}
          - {label: "Client or brand", name: client, widget: string, required: false}
          - {label: "Date", name: date, widget: string, required: false, hint: "For example March 2026"}
          - label: "Photos (the first one is the cover)"
            name: photos
            widget: list
            field: {label: Photo, name: photo, widget: image}
          - {label: "Show", name: show, widget: boolean, default: true}
      - label: "Polaroids"
        name: polaroids
        widget: list
        required: false
        field: {label: Photo, name: photo, widget: image}
      - {label: "Comp card images (front and back)", name: comp_card_images, widget: list, required: false, field: {label: Image, name: image, widget: image}}
      - {label: "Comp card (PDF)", name: comp_card, widget: file, required: false}
      - {label: "Hide Jobs on this model", name: hide_jobs, widget: boolean, required: false, default: false}
      - {label: "Hide Polaroids on this model", name: hide_polaroids, widget: boolean, required: false, default: false}
      - {label: "Hide Comp card on this model", name: hide_comp_card, widget: boolean, required: false, default: false}
      - {label: "Hide About text on this model", name: hide_bio, widget: boolean, required: false, default: false}
      - {label: "Hide Book button on this model", name: hide_book, widget: boolean, required: false, default: false}
      - {label: "Hide Shortlist on this model", name: hide_shortlist, widget: boolean, required: false, default: false}
      - {label: "Active", name: active, widget: boolean, default: true}
  - name: journal
    label: "Journal"
    label_singular: "Post"
    folder: journal
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}}"
    media_folder: /images/journal
    public_folder: /images/journal
    fields:
      - {label: "Title", name: title, widget: string}
      - {label: "Date", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD"}
      - {label: "Cover photo", name: cover, widget: image, required: false}
      - {label: "Short summary", name: excerpt, widget: text, required: false}
      - label: "Tags"
        name: tags
        widget: list
        required: false
        field: {label: Tag, name: tag, widget: string}
      - {label: "Hide this post (draft)", name: draft, widget: boolean, required: false, default: false}
      - {label: "Story", name: body, widget: markdown}
